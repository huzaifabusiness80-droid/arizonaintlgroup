<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Modern Geometric 'A' Icon with Global Wing Orbit -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Hex Background Ring -->
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.5"/>
    
    <!-- Stylized 'A' Wings -->
    <path d="M 30 13 L 47 48 L 38.5 48 L 34.5 39 L 25.5 39 L 21.5 48 L 13 48 Z M 30 25.5 L 27.5 34 L 32.5 34 Z" fill="url(#logoBlueGrad)" />
    
    <!-- Dynamic Orbit Swoosh Accent -->
    <path d="M 12 36 C 22 28, 38 28, 48 36 C 44 38, 34 33, 12 36 Z" fill="url(#wingGrad)" opacity="0.9" />
  </g>

  <!-- Typography: ARIZONA INTERNATIONAL GROUP -->
  <g transform="translate(82, 38)">
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="24" font-weight="700" fill="#0f172a" letter-spacing="-0.5">ARIZONA</text>
    <text x="1" y="19" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" fill="#2563eb" letter-spacing="2.8">INTERNATIONAL GROUP</text>
  </g>
</svg>
